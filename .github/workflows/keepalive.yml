# Zaxira: asosiy uyg'oq tutish serverning o'zida (src/index.js → keepAwake).
# Agar server qayta ishga tushib, biror sabab bilan uxlab qolsa — bu turtki uni uyg'otadi. Kecha-kunduz.
name: Serverni uyg'oq tutish

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS --max-time 90 --retry 2 https://fatima-sadirhanova-api.onrender.com/api/health || true
